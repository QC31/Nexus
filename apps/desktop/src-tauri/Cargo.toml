[package]
name = "nexus"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15.0"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util"] }
hickory-resolver = "0.26.3"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
rustls = "0.23.45"
rustls-pki-types = "1.15.1"
tokio-rustls = "0.26.5"
rustls-platform-verifier = "0.7.0"
x509-parser = "0.18"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = "0.63.3"
russh-sftp = "3.0.1"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1.26.1", features = ["v4"] }
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.23.0"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
